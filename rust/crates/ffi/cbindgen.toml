language = "C"
cpp_compat = true
include_guard = "KOD_FFI_H"
autogen_warning = "/* Generated by cbindgen from rust/crates/ffi. Do not edit; run scripts/gen-ffi-header.sh. */"
include_version = false
usize_is_size_t = true
style = "both"

[export]
prefix = ""
exclude = ["kod_test_panic"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[defines]
"feature = test-hooks" = "KOD_TEST_HOOKS"
